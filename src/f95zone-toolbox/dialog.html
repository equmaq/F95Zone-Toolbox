<form method="dialog" class="f95-toolbox">
  <div class="f95-toolbox-body">
    <header class="f95-toolbox-header">
      <p class="f95-toolbox-intro">{{INTRO}}</p>
      <h2>F95Zone Toolbox</h2>
      <p>Choose which modules should be active. Changes are saved immediately and applied upon reload.</p>
    </header>
    {{SECTIONS}}
  </div>
  <footer class="f95-toolbox-footer">
    <small>Open this menu again from the userscript manager menu.</small>
    <button type="submit" value="apply" class="button--primary button">Apply</button>
  </footer>
</form>
